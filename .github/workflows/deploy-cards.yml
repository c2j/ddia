name: Deploy Cards Prototype

# 把 cards/ 权衡卡原型构建后发布到 GitHub Pages：
#   https://c2j.github.io/ddia/cards/
# 与 Hugo 主站（baseURL 指向 ddia.vonng.com）互不影响。

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - ".github/workflows/deploy-cards.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-cards"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate cards
        run: python cards/check.py

      - name: Build cards HTML
        run: python cards/build.py

      - name: Verify build output
        run: |
          test -f cards/index.html
          test -f cards/icon-192.png
          test -f cards/icon-512.png
          grep -q 'class="card"' cards/index.html

      # 卡片原型放在 /cards/ 子路径下，重写站内原书链接，
      # 让 "进阶阅读" 直接跳到本 Pages 站点内的 /ch6/... 页面。
      # 注意：Pages 站点目前只包含 cards/，主站章节页由 Hugo workflow
      # 或后续合并部署提供；若本章页面不存在，链接会 404，
      # 因此这里同时生成一份轻量 Hugo 站点，包含全部章节页。
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r cards site/cards
          # 安装 Hugo extended（主题 oink 要求 >=0.160.1；apt 源版本过旧不可用）
          HUGO_VERSION=0.165.0
          curl -sSLo /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version
          # destination 用仓库内绝对路径，避免相对路径基准歧义
          hugo --gc --minify --destination "$GITHUB_WORKSPACE/site" \
            --source "$GITHUB_WORKSPACE" --baseURL https://c2j.github.io/ddia/
          test -f site/index.html && echo "root page OK"
          test -f site/ch6/index.html && echo "ch6 OK"
          # cards 与裁剪版 zh 主站合并发布。
          # 此前整站（64M）部署在 Pages 端持续卡 updating_pages 超时；
          # 裁剪掉多语言版本/打印版/章节地图/多语言搜索索引后约 19M，部署正常。
          du -sh site
          rm -rf site/tw site/v1 site/v1_tw site/_print site/map                   site/indexes site/categories site/tags site/search
          rm -f site/offline-search-index.tw.*.json                 site/offline-search-index.v1.*.json                 site/offline-search-index.v1_tw.*.json
          # cards 挂到 /cards/ 子路径
          rm -rf site/cards && cp -r cards site/cards
          du -sh site
          test -f site/index.html && test -f site/ch6/index.html && test -f site/cards/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://c2j.github.io/ddia/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
